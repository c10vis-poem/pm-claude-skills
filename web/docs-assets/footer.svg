<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Plant a skill of your own — contributions welcome">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2e4d"/>
      <stop offset=".5" stop-color="#2a1a5e"/>
      <stop offset="1" stop-color="#1b1035"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .sway { animation: sway 4s ease-in-out infinite; transform-origin: bottom center; }
      .s2 { animation-delay: -1.3s; } .s3 { animation-delay: -2.6s; }
      @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
      .tw { animation: tw 2.8s ease-in-out infinite; } .tw2 { animation-delay: -1.4s; }
      @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:.9 } }
    </style>
  </defs>
  <rect width="1200" height="150" rx="16" fill="url(#fbg)"/>
  <path d="M0 118 q150 -26 300 -8 q150 18 300 0 q150 -18 300 -4 q150 14 300 -6 v50 h-1200z" fill="#173a2b" opacity=".85"/>
  <path d="M0 130 q200 -18 400 -4 q200 14 400 -2 q200 -16 400 2 v24 h-1200z" fill="#1d4a35"/>
  <g class="sway"><text x="290" y="122" font-size="30">🌱</text></g>
  <g class="sway s2"><text x="620" y="118" font-size="26">🌿</text></g>
  <g class="sway s3"><text x="930" y="120" font-size="30">🌷</text></g>
  <g fill="#cbb8ff">
    <path class="tw" d="M120 40 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5z"/>
    <circle class="tw2" cx="1080" cy="44" r="3"/>
    <circle class="tw" cx="820" cy="30" r="2.5"/>
  </g>
  <text x="600" y="62" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">The library grows a skill at a time — plant one of your own</text>
  <text x="600" y="92" font-size="16" fill="#a99fd6" text-anchor="middle">One markdown file, one PR. The standard and the scaffolder do the heavy lifting.</text>
</svg>
